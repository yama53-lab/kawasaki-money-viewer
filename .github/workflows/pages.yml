name: Refresh data and publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install PDF extraction dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement scripts/requirements-update.txt
      - name: Refresh subsidy datasets from official PDFs
        run: python3 scripts/update_data.py --pdf-dir tmp/pdfs --output data
      - name: Rebuild general account manifest
        run: python3 scripts/update_general_account.py
      - name: Test data validation
        run: node --test tests/security.test.cjs
      - name: Test download safeguards
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare allowlisted files
        id: prepare
        run: python3 scripts/prepare_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.prepare.outputs.directory }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
